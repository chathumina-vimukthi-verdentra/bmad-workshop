# Team override for bmad-ux in the product track. Arrays append to the skill's defaults.
# It adds a Figma pull: the user gives a Figma link in the chat and the skill reads it live through the
# Figma MCP server, instead of drawing mockups. No link is stored here.

[workflow]

persistent_facts = [
  "When the user gives a figma.com/design link, Figma is the visual source for this run. Read it live with the Figma MCP server; do not draw competing HTML mockups for screens that exist in Figma. Spines still win on conflict, and anything the Figma file does not show (states, components other screens need, accessibility, behavior) is captured in conversation as usual, never invented.",
  "The hand-over keeps a frozen snapshot of the Figma frames: one PNG per frame in scope and a README in imports/figma/. The spines carry the Figma link and node ids, so a reader with access can open the live design, and a reader without access still has the snapshot.",
]

creative_tools = [
  """tool:figma: Figma pull. Use when the user gives a figma.com/design link, during Discovery or before Finalize. Take the fileKey from the URL path and the node-id from the query, with - read as :. Then:
  1. get_metadata on that node. With no node-id, get_metadata without one lists the pages; then call it on the page. List the top-level frames to the user and ask which are in scope, and how they relate (for example, one frame is the app shell and another is the screen inside it).
  2. For each frame in scope, read get_design_context in this session (the layout, the text, the colours, the type and the components; the generated code is reference only, never saved or copied into the spines).
  3. For each frame in scope, get_screenshot returns a short-lived image URL. Download it to {doc_workspace}/imports/figma/<nn>-<frame-slug>.png with `curl -f -L -o <path> "<url>"` (on Windows use curl.exe). If the download fails, say so and note it in the README; do not stop the run.
  4. get_variable_defs on each frame. If it returns variables, use them as the tokens. If it returns nothing, take the colours, font, radius and spacing from the design context, tell the user, and log it as an assumption.
  5. Write {doc_workspace}/imports/figma/README.md: the link, the date, and one line per frame with its name, its node id, its PNG and what it shows, including how it relates to the other frames.
  6. Log one memlog event per frame imported, and one decision naming the Figma link as the visual source.
  Then lift visual decisions (tokens, type, components) into DESIGN.md and behavior (IA, steps, states, copy) into EXPERIENCE.md. Cite the Figma link and the frame's node id and PNG at the matching sections. Where Figma conflicts with the PRD, the starter app or an inherited DESIGN.md, surface it and let the user decide; never resolve it silently. Imports stay in imports/ at Finalize; they are not promoted to mockups/.""",
]

design_handoffs = [
  "Figma (https://www.figma.com): the designer works in Figma and gives the link. Read it with the Figma creative tool; the snapshot lands in imports/figma/.",
]
